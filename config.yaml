wiki:
  apiUrl: https://publictestwiki.com/w/api.php
  # wikiId: zhwiki  # Needed when forcing eventstream on a non-zhwiki site.
  username: AmanojakuBot
  loginUsername: AmanojakuBot@bot  # Only for a BotPassword login.
  ownerUserId: 143
  draftNamespace: 118
  talkPage: User talk:AmanojakuBot
  personaPage: User:AmanojakuBot/config/persona
  controlPage: User:AmanojakuBot/config/control
  # timestampFormat: "14:14, 7 June 2026 (UTC)"  # 可选：publictestwiki（默认）或自定义签名时间戳格式
events:
  # mode: eventstream  # Auto: zhwiki=eventstream, other API URLs=polling.
  mode: polling
  pollIntervalSeconds: 10
  overlapSeconds: 10
storage:
  dbPath: bot.test.sqlite  # Use a separate DB file per wiki.
llm:
  provider: openai
  model: gpt-4o-mini
tasks:
  review:
    enabled: false
    dailyLimit: 10
  aiEdit:
    enabled: false
    reportPagePrefix: User:AmanojakuBot/sandbox/AICheck
    usersPage: User:AmanojakuBot/sandbox/AICheckUser
    maxAnalysesPerWindow: 20
    minConfidence: 0.85
writeEnabled: true
