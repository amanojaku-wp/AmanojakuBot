wiki:
  apiUrl: https://zh.wikipedia.org/w/api.php
  wikiId: zhwiki # Needed when forcing eventstream on a non-zhwiki site.
  username: AmanojakuBot
  loginUsername: AmanojakuBot@bot # Only for a BotPassword login.
  ownerUserId: 4073200
  controlPage: User:AmanojakuBot/config/control
  writeEnabled: false

events:
  mode: eventstream # Auto: zhwiki=eventstream, other API URLs=polling.
  pollIntervalSeconds: 60
  overlapSeconds: 60

storage:
  type: sqlite
  dbPath: bot.zhwp.sqlite # Use a separate DB file per wiki.

log:
  level: info
  responseTokenOnWiki: false

# 运行时并发与超时约束（均可省略，使用括号内默认值）
# 「认领」与「执行」分离后，多笔工作会并行执行：同页面/同章节严格串行，异页面并行。
runtime:
  workConcurrency: 3 # 后台工作并发上限（默认 3）
  slowWaitSeconds: 30 # 排队等待超过该时长输出 warn（默认 30）
  statsIntervalSeconds: 300 # 运行状态统计日志间隔，秒；0 关闭（默认 300）
  llmMaxConcurrent: 2 # 同时进行的 LLM 调用上限（默认 2）
  llmTimeoutSeconds: 180 # 单次 LLM 调用超时，秒（默认 180）

llm:
  provider: google
  model: gemini-3.7-flash

tasks:
  chat:
    enabled: true
    llm:
      provider: openai
      model: gpt-5.6-luna
    talkPage: User talk:AmanojakuBot
    personaPage: User:AmanojakuBot/task/U1/persona

  review:
    enabled: true
    draftNamespace: [2, 118]
    userDailyLimit: 100
    cleanupCron: "0 * * * *" # 积压校对请求兜底清理的 cron 调度（UTC 时区）
    talkPage: User talk:AmanojakuBot/review
    rulePage: User:AmanojakuBot/task/U2/rule
    template: User:AmanojakuBot/template/ReviewRequest
    llm:
      - provider: openai
        model: gpt-5.6-luna
      - provider: openai
        model: gpt-5.6-luna

  aiEdit:
    enabled: true
    reportPagePrefix: User:AmanojakuBot/task/U3/check
    usersPage: User:AmanojakuBot/task/U3/checkuser
    rulePage: User:AmanojakuBot/task/U3/rule
    silent: true
    cron: "0 * * * *" # 3-1 动态扫描的 cron 调度（UTC 时区，默认每小时整点）
    summaryCron: "0 20 * * *" # 3-1 扫描成本每日汇总写入 debugLog 的 cron 调度（UTC 时区，默认每天 20:00）
    debugLog: /data/project/seijabot/AmanojakuBot/ai-edit.log
    #maxAnalysesPerWindow: 20
    minConfidence: 0
    linkCheck: true # 参考文献 / 外部链接 URL 可达性检查（确定性检查，不依赖 LLM，也**不作为模型输入**；仅在模型确实分析出其它线索时才执行，并作为单独一份补充结果附上；优先 IPv4；已存档的引用与存档站链接不检查；本机 DNS 解析失败仅算「未能检查」，不计为失效）
    #linkCheckTimeoutSeconds: 15 # 单个链接探测超时（秒）
    talkPage: User talk:AmanojakuBot/ai
    template: User:AmanojakuBot/template/AICheckRequest
    draftNamespace: [2, 118] # 3-2 请求额外允许的草稿命名空间（3-1 扫描仅处理条目 ns 0）
    llm:
      - provider: openai
        model: gpt-5.6-luna
      - provider: openai
        model: gpt-5.6-luna

  afc:
    enabled: true
    draftNamespace: [2, 118]
    userDailyLimit: 100
    cleanupCron: "0 * * * *" # 积压 AfC 请求兜底清理的 cron 调度（UTC 时区）
    talkPage: User talk:AmanojakuBot/afc
    rulePage: User:AmanojakuBot/task/U4/rule
    template: User:AmanojakuBot/template/ReviewRequest
    llm:
      - provider: openai
        model: gpt-5.6-luna
      - provider: openai
        model: gpt-5.6-luna
