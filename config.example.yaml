wiki:
  apiUrl: https://zh.wikipedia.org/w/api.php
  wikiId: zhwiki # Needed when forcing eventstream on a non-zhwiki site.
  username: AmanojakuBot
  loginUsername: AmanojakuBot@bot # Only for a BotPassword login.
  ownerUserId: 4073200
  controlPage: User:AmanojakuBot/config/control
  writeEnabled: false

events:
  mode: eventstream # Auto: zhwiki=eventstream, other API URLs=polling.
  pollIntervalSeconds: 60
  overlapSeconds: 60

storage:
  type: sqlite
  dbPath: bot.zhwp.sqlite # Use a separate DB file per wiki.

log:
  level: info
  responseTokenOnWiki: false

llm:
  provider: gemini
  model: gemini-3.7-flash

tasks:
  chat:
    enabled: true
    llm:
      provider: openai
      model: gpt-4o-mini
    talkPage: User talk:AmanojakuBot
    personaPage: User:AmanojakuBot/config/persona

  review:
    enabled: true
    draftNamespace: [2, 118]
    userDailyLimit: 5
    talkPage: User talk:AmanojakuBot/review
    rulePage: User:AmanojakuBot/task/2/rule
    template: User:AmanojakuBot/template/ReviewRequest
    llm:
      - provider: openai
        model: gpt-5.6-luna
      - provider: openai
        model: gpt-5.6-luna

  aiEdit:
    enabled: false
    reportPagePrefix: User:AmanojakuBot/sandbox/AICheck
    usersPage: User:AmanojakuBot/sandbox/AICheckUser
    rulePage: User:AmanojakuBot/task/3/rule
    draftNamespace: 118
    maxAnalysesPerWindow: 20
    minConfidence: 0.85
    llm:
      - provider: openai
        model: gpt-5.4-mini
      - provider: openai
        model: gpt-4o-mini
